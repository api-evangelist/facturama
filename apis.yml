aid: facturama
name: Facturama
description: >-
  Facturama is a cloud-based Mexican electronic invoicing (CFDI) platform that lets
  businesses generate, stamp, download, and cancel digital tax receipts (Comprobante
  Fiscal Digital por Internet) through a REST API. It serves 55,000+ clients — mostly
  SMEs and startups — and exposes two API products: API Web (single issuer, tied to
  a Facturama account) and API Multiemisor (multi-issuer, for platforms that invoice
  on behalf of many taxpayers). The API supports CFDI 4.0 invoices, payroll receipts
  (nómina), payment complements (complemento de pago), credit notes, Carta Porte
  (cargo/transport), foreign trade (comercio exterior), and donation receipts, plus
  management of clients, products/services, branch offices, series, and SAT catalogs
  (postal codes, currencies, payment methods, tax regimes). Authentication is HTTP
  Basic. A sandbox environment and 15 free test invoices during a 30-day trial are
  available, along with first-party SDKs for PHP, Java, .NET, Node.js, JavaScript,
  Python, and Ruby and a public Postman collection.
